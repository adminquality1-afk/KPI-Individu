<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KPI & Skill Matrix Man Power Quality</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eceeea;--card:#fff;--ink:#1c2a2d;--mut:#66767a;--line:#d5dad6;--pri:#2b5a60;--acc:#e3a420;--ok:#2f8f5b;--bad:#c4472f;--l0:#e6e9e6;--l1:#f4d9a0;--l2:#e3a420;--l3:#5aa58a;--l4:#2b5a60;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1c;--card:#1d2729;--ink:#e6ecea;--mut:#8fa1a4;--line:#314043;--pri:#5fb0b8;--l0:#2a3638;--l1:#6b5a2a;--l2:#c8921a;--l3:#3f8a70;--l4:#5fb0b8}}
:root[data-theme="dark"]{--bg:#141b1c;--card:#1d2729;--ink:#e6ecea;--mut:#8fa1a4;--line:#314043;--pri:#5fb0b8;--l0:#2a3638;--l1:#6b5a2a;--l2:#c8921a;--l3:#3f8a70;--l4:#5fb0b8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{padding:18px 16px 0;max-width:1200px;margin:auto}h1{font-size:20px;margin:0 0 2px;font-weight:600}.sub{color:var(--mut);margin:0 0 12px}
nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line)}
nav button{background:none;border:0;padding:9px 14px;color:var(--mut);font:inherit;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav button.on{color:var(--ink);font-weight:600;border-color:var(--acc)}
main{max-width:1200px;margin:auto;padding:16px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
input,select,button.b{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:5px;padding:6px 8px}
input[type=number]{width:70px}
button.b{cursor:pointer;background:var(--pri);color:#fff;border-color:var(--pri)}button.b.g{background:var(--card);color:var(--ink);border-color:var(--line)}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 10px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:500;color:var(--mut);font-size:12px;vertical-align:bottom;white-space:normal}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.lv{display:inline-block;min-width:34px;text-align:center;border-radius:4px;padding:2px 6px;font-weight:600}
.lv0{background:var(--l0);color:var(--mut)}.lv1{background:var(--l1);color:#3b2d00}.lv2{background:var(--l2);color:#2b1f00}.lv3{background:var(--l3);color:#fff}.lv4{background:var(--l4);color:#fff}
.tag{font-size:12px;padding:2px 7px;border-radius:10px;background:var(--l0)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.mut{color:var(--mut)}
.note{color:var(--mut);font-size:12px;margin:8px 0 0}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<header><h1>KPI & Skill Matrix Man Power Quality</h1><p class="sub">KPI individu bulanan, rekap 4 bulan, lalu hasilnya ke General Matrix dan Multi Skill.</p><p class="note" id="st"></p><nav id="nav"></nav></header>
<main id="app"></main>
<script>
const KEY="kpi-mp-v2",$=s=>document.querySelector(s);
const bulan=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
// 7 point KPI sesuai sheet KPI Excel: sumber realisasi -> kep/pre/dis/imp/trn/qcc
const defKpi=[
{n:"Kepatuhan",src:"kep",bobot:30},{n:"Penggunaan Alat Ukur & Equipment",src:"pre",bobot:10},
{n:"Kedisiplinan & Safety (K3)",src:"dis",bobot:20},{n:"Administrasi & Pelaporan",src:"pre",bobot:10},
{n:"Improvement",src:"imp",bobot:10},{n:"Training & Pelatihan",src:"trn",bobot:10},{n:"QCC & Suggestion System",src:"qcc",bobot:10}];
const SRC={kep:"Kepatuhan",pre:"Preparation",dis:"Kedisiplinan",imp:"Improvement",trn:"Training",qcc:"QCC"};
const L=["BANDASSY","COVER HINO","COVER D74A","COVER D74A H/R","IMV FRONT","IMV RR1","IMV RR2","FUJISEAT REGULER","FUJISEAT D26A","FUJISEAT D37D","INCOMING"];
const seed=()=>({emps:[["e1","ADI SAFRI FALAKHI","2506440"],["e2","M. WILDAN ABABIL","2501307"],["e3","M HANIF SAPARUDIN","2412254"],["e4","RENDI KURNIAWAN","2412256"],["e5","TIKA FATMULIA","2505429"],["e6","M. DWIYAN ALFARIS","2503380"]].map(a=>({id:a[0],nama:a[1],nik:a[2]})),
rec:{"e1|2026-01":{line:"IMV FRONT",kepO:150,kepX:20,disO:300,disX:30,preO:200,preX:20,impA:0,trnA:0,qccA:2},
"e1|2026-02":{line:"COVER HINO",kepO:160,kepX:30,disO:310,disX:60,preO:180,preX:20,impA:1,trnA:2,qccA:2},
"e2|2026-01":{line:"BANDASSY",kepO:133,kepX:0,disO:342,disX:0,preO:100,preX:0,impA:1,trnA:2,qccA:2},
"e3|2026-01":{line:"COVER D74A",kepO:120,kepX:15,disO:250,disX:25,preO:90,preX:10,impA:0,trnA:2,qccA:0}},
cfg:{kpi:defKpi,lines:L,thr:{imp:1,trn:2,qcc:2}}});
const blank=()=>({emps:[],rec:{},day:{},abs:{},cfg:seed().cfg});
let S;try{S=window.__SNAP||JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.emps)S=blank();
if(!S.day)S.day={};if(!S.abs)S.abs={};
let RO=!!window.__SNAP,DB=null,tm,knownYears=new Set(),knownDm=new Set(),dirty=new Set();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}sync()};
const now=new Date();let tab="dash",mode="m",yr=now.getFullYear(),ym=`${yr}-${String(now.getMonth()+1).padStart(2,"0")}`;

let per=Math.floor((+ym.slice(5)-1)/4),sel=S.emps[0]?.id;
const months=(y,p)=>[0,1,2,3].map(i=>`${y}-${String(p*4+i+1).padStart(2,"0")}`);
const mname=m=>bulan[+m.slice(5)-1]+" "+m.slice(2,4);
const f1=v=>v==null?"–":(Math.round(v*10)/10).toString();
const pc=v=>v==null?"–":f1(v*100)+"%";
const avg=a=>{a=a.filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null};
// Line mengikuti line bulan berjalan; kalau belum diisi ikut bulan terakhir sebelumnya
function dayKeys(id,m){return Object.keys(S.day).filter(k=>k.startsWith(id+"|"+m)).sort()}
function lineOf(id,m){const dk=dayKeys(id,m);if(dk.length)return S.day[dk[dk.length-1]].line;
 const r=S.rec[id+"|"+m];if(r&&r.line)return r.line;
 const ms=[...Object.keys(S.rec).filter(k=>k.startsWith(id+"|")).map(k=>k.slice(-7)),...Object.keys(S.day).filter(k=>k.startsWith(id+"|")).map(k=>k.slice(-10,-3))].filter(x=>x<m).sort();
 return ms.length?lineOf(id,ms[ms.length-1]):S.cfg.lines[0]}
const ratio=(o,x)=>(o==null||o===""||x==null||x==="")||(+o+ +x)==0?null:+o/(+o+ +x);
const hit=(v,t)=>v==null||v===""?null:(+v>=t?1:0);
// komponen bulanan: kep, dis, pre (rasio kesesuaian) + imp, trn, qcc (1 jika target tercapai)
function comp(id,m){const r=S.rec[id+"|"+m]||{},dk=dayKeys(id,m);if(!Object.keys(r).length&&!dk.length)return null;const t=S.cfg.thr;
 const sm=f=>dk.reduce((a,k)=>a+(+S.day[k][f]||0),0),has=f=>dk.some(k=>S.day[k][f]!=null&&S.day[k][f]!=="");
 const g=(o,x)=>has(o)||has(x)?ratio(sm(o),sm(x)):ratio(r[o],r[x]);
 return{line:lineOf(id,m),kep:g("kepO","kepX"),dis:g("disO","disX"),pre:g("preO","preX"),imp:hit(r.impA,t.imp),trn:hit(r.trnA,t.trn),qcc:hit(r.qccA,t.qcc)}}
const ms=()=>mode==="m"?[ym]:months(yr,per);
// rata-rata komponen untuk daftar bulan (opsional hanya line tertentu)
function agg(id,list,line){const cs=list.map(m=>comp(id,m)).filter(c=>c&&(!line||c.line===line));
 if(!cs.length)return null;const o={n:cs.length};Object.keys(SRC).forEach(k=>o[k]=avg(cs.map(c=>c[k])));return o}
function kpi(id,list){const c=agg(id,list);if(!c)return null;
 const pts=S.cfg.kpi.map(k=>{const real=c[k.src];if(real==null)return{real:null,score:null};return{real,score:Math.min(real/1,1.2)*k.bobot}});
 const f=pts.filter(p=>p.score!=null),gross=f.length?f.reduce((a,p)=>a+p.score,0):null,ml=list.filter(m=>comp(id,m)),ded=ml.length?ml.reduce((a,m)=>a+absDed(id,m),0)/ml.length:0;
 return{c,pts,gross,ded,total:gross==null?null:Math.max(0,gross-ded),complete:f.length===pts.length}}
const grade=t=>t==null?null:t>=90?["A","Sangat Baik"]:t>=80?["B","Baik"]:t>=70?["C","Cukup Baik"]:["D","Kurang Baik"];
const pgrade=(s,b)=>s==null?"–":s>=b?"A":s>=.9*b?"B":s>=.8*b?"C":"D";
const q=v=>v==null?null:Math.round(v*100/25)*25;       // level skill 0/25/50/75/100
const lv=p=>p==null?'<span class="mut">–</span>':`<span class="lv lv${p/25}">${p}</span>`;

function bar(m){const ys=[...new Set([yr,now.getFullYear(),now.getFullYear()+1,now.getFullYear()+2,...Object.keys(S.rec).map(k=>+k.slice(-7,-3))])].sort();
 return `<div class="bar">${m.mode?`<label>Tampilan<select onchange="mode=this.value;draw()"><option value="m" ${mode=="m"?"selected":""}>Per bulan</option><option value="r" ${mode=="r"?"selected":""}>Rekap 4 bulan</option></select></label>`:""}
 ${m.month&&(!m.mode||mode=="m")?`<label>Bulan<input type="month" value="${ym}" onchange="setYm(this.value)"></label>`:""}
 ${m.per&&(!m.mode||mode=="r")?`<label>Tahun<select onchange="yr=+this.value;draw()">${ys.map(y=>`<option ${y==yr?"selected":""}>${y}</option>`).join("")}</select></label><label>Periode<select onchange="per=+this.value;draw()">${[0,1,2].map(p=>`<option value="${p}" ${p==per?"selected":""}>${bulan[p*4]}–${bulan[p*4+3]}</option>`).join("")}</select></label>`:""}</div>`}
function setYm(v){if(!v)return;ym=v;yr=+v.slice(0,4);per=Math.floor((+v.slice(5)-1)/4);draw()}
const title=()=>mode==="m"?mname(ym):`Rekap ${bulan[per*4]}–${bulan[per*4+3]} ${yr}`;
const lines=(id,list)=>[...new Set(list.map(m=>comp(id,m)?.line).filter(Boolean))].join(", ")||"–";

const views={
dash(){let h=bar({mode:1,month:1,per:1}),list=ms();
 h+=`<div class="card"><h2>KPI individu – ${title()}</h2><div class="sc"><table><thead><tr><th>Karyawan</th><th>Line</th>`+S.cfg.kpi.map((k,i)=>`<th class="n">${i+1}. ${k.n}</th>`).join("")+`<th class="n">Potongan absensi</th><th class="n">Total</th><th>Grade</th><th>Data</th></tr></thead><tbody>`;
 S.emps.forEach(e=>{const k=kpi(e.id,list),g=k&&grade(k.total);
  h+=`<tr><td><a href="#" onclick="sel='${e.id}';draw();return false" style="color:var(--pri)">${e.nama}</a></td><td>${lines(e.id,list)}</td>`+
  (k?k.pts.map(p=>`<td class="n">${pc(p.real)}</td>`).join("")+`<td class="n">${k.ded?"-"+f1(k.ded):"0"}</td><td class="n"><b>${f1(k.total)}</b></td><td>${g?g[0]+" – "+g[1]:"–"}</td><td>${k.complete?'<span class="ok">Lengkap</span>':'<span class="bad">Belum lengkap</span>'}</td>`
  :`<td colspan="${S.cfg.kpi.length}" class="mut">Belum ada data</td><td></td><td></td><td></td><td class="bad">Kosong</td>`)+`</tr>`});
 h+=`</tbody></table></div><p class="note">Realisasi terisi otomatis dari input checksheet (Kepatuhan, Kedisiplinan, Preparation) dan data Improvement, Training, QCC. Klik nama untuk detail.</p></div>`;
 const e=S.emps.find(x=>x.id===sel),k=e&&kpi(e.id,list),ac=e&&absSum(e.id,list);
 if(k){h+=`<div class="card"><h2>Detail: ${e.nama} · ${lines(e.id,list)} · ${title()}</h2><div class="sc"><table><thead><tr><th>No</th><th>KPI</th><th>Sumber realisasi</th><th class="n">Target</th><th class="n">Realisasi</th><th class="n">Bobot (%)</th><th class="n">Score</th><th>Grade</th></tr></thead><tbody>`;
  S.cfg.kpi.forEach((c,i)=>{const p=k.pts[i];h+=`<tr><td>${i+1}</td><td>${c.n}</td><td>${SRC[c.src]}</td><td class="n">100%</td><td class="n">${pc(p.real)}</td><td class="n">${c.bobot}</td><td class="n">${f1(p.score)}</td><td>${pgrade(p.score,c.bobot)}</td></tr>`});
  const g=grade(k.total);h+=`<tr><td></td><td>Jumlah score 7 point</td><td></td><td></td><td></td><td></td><td class="n">${f1(k.gross)}</td><td></td></tr><tr><td></td><td>Potongan absensi (${mode==="r"?"rata-rata per bulan dari ":""}sakit ${ac.S} hari × ${pen().s}, alpa ${ac.A} hari × ${pen().a}; cuti ${ac.CT+ac.CK} hari tidak dipotong)</td><td></td><td></td><td></td><td></td><td class="n">${k.ded?"-"+f1(k.ded):"0"}</td><td></td></tr><tr><td></td><td><b>TOTAL</b></td><td></td><td></td><td></td><td class="n"><b>${S.cfg.kpi.reduce((a,c)=>a+c.bobot,0)}</b></td><td class="n"><b>${f1(k.total)}</b></td><td><b>${g?g[0]:"–"}</b></td></tr></tbody></table></div><p class="note">Score = MIN(realisasi ÷ target, 1,2) × bobot. Grade: A ≥ 90, B 80–89, C 70–79, D &lt; 70. Total = jumlah score dikurangi potongan absensi (tidak kurang dari 0).</p></div>`}
 h+=`<div class="bar"><button class="b g" onclick="exportKpi()">Unduh KPI (${title()}) CSV</button><button class="b" onclick="exportXlsx()">Unduh laporan Excel (.xlsx) – siap ke Google Drive</button></div>`;
 const opt=S.emps.map(x=>`<option value="${x.id}" ${x.id==sel?"selected":""}>${x.nama}</option>`).join("");
 if(e){h+=`<div class="bar"><label>Grafik untuk karyawan<select onchange="sel=this.value;draw()">${opt}</select></label></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">
 <div class="card"><h2>Tren KPI bulanan ${yr}</h2>${barSvg(bulan.map((b,i)=>({l:b,v:kpi(e.id,[`${yr}-${String(i+1).padStart(2,"0")}`])?.total})))}</div>
 <div class="card"><h2>Rekap per 4 bulan ${yr}</h2>${barSvg([0,1,2].map(p=>({l:bulan[p*4]+"–"+bulan[p*4+3],v:kpi(e.id,months(yr,p))?.total})))}</div>
 <div class="card"><h2>KPI tahunan ${yr} (rata-rata 12 bulan)</h2>${barSvg([{l:String(yr),v:kpi(e.id,mall(yr))?.total}])}</div>
 <div class="card"><h2>Tren tahunan antar tahun</h2>${barSvg(dyears().map(y=>({l:String(y),v:kpi(e.id,mall(y))?.total})))}</div></div>`}
 if(e&&mode==="m"){const nd=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
  h+=`<div class="card"><h2>Chart harian – ${e.nama} – ${mname(ym)}</h2><p class="note">Persentase kesesuaian per tanggal; garis putus-putus = 90. Tanggal tanpa data dikosongkan.</p><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px">`+
  CS.map(c=>`<div><b>${c[1]}</b>${barSvg(Array.from({length:nd},(_,i)=>({l:String(i+1),v:dayPct(e.id,`${ym}-${String(i+1).padStart(2,"0")}`,c[0])})),false,true)}</div>`).join("")+`</div></div>`}
 h+=`<div class="card"><h2>Perbandingan karyawan – ${title()}</h2>${barSvg(S.emps.map(x=>({l:x.nama.split(" ").slice(0,2).join(" "),v:kpi(x.id,list)?.total})),true)}<p class="note">Garis putus-putus = batas grade A (90).</p></div>`;
 h+=`<div class="card"><h2>Perbandingan karyawan – tahunan ${yr}</h2>${barSvg(S.emps.map(x=>({l:x.nama.split(" ").slice(0,2).join(" "),v:kpi(x.id,mall(yr))?.total})),true)}</div>`;
 return h},
input(){let h=bar({month:1});
 h+=`<div class="card"><h2>Input bulanan – ${mname(ym)}</h2><div class="sc"><table><thead><tr><th>Karyawan</th><th>Line bulan ini</th><th class="n">Kepatuhan<br>O sesuai</th><th class="n">Kepatuhan<br>X tidak</th><th class="n">Kedisiplinan<br>tidak melanggar</th><th class="n">Kedisiplinan<br>melanggar</th><th class="n">Preparation<br>OK</th><th class="n">Preparation<br>NG</th><th class="n">Improvement<br>actual</th><th class="n">Training<br>jam actual</th><th class="n">QCC<br>actual</th></tr></thead><tbody>`;
 S.emps.forEach(e=>{const r=S.rec[e.id+"|"+ym]||{},ln=lineOf(e.id,ym);
  h+=`<tr><td>${e.nama}</td><td><select onchange="setF('${e.id}','line',this.value)">${S.cfg.lines.concat(S.cfg.lines.includes(ln)?[]:[ln]).map(l=>`<option ${l==ln?"selected":""}>${l}</option>`).join("")}</select></td>`+
  ["kepO","kepX","disO","disX","preO","preX","impA","trnA","qccA"].map(f=>{const dk=dayKeys(e.id,ym),au=FL.indexOf(f)<6&&dk.some(k=>S.day[k][f]!=null);return au?`<td class="n"><b>${dk.reduce((a,k)=>a+(+S.day[k][f]||0),0)}</b> <span class="tag">harian</span></td>`:`<td class="n"><input type="number" min="0" step="any" value="${r[f]??""}" onchange="setF('${e.id}','${f}',this.value)"></td>`}).join("")+`</tr>`});
 const t=S.cfg.thr;return h+`</tbody></table></div><p class="note">Isi jumlah total dari checksheet bulan ini (jumlah O dan X di akhir lembar checksheet). Kepatuhan = O ÷ (O+X). Improvement tercapai jika actual ≥ ${t.imp}, Training jika ≥ ${t.trn} jam, QCC jika ≥ ${t.qcc}. Line disimpan per bulan: pindah line di bulan berikutnya tidak mengubah bulan sebelumnya. Jika checksheet bulan ini sudah diisi harian di tab Input harian, nilai harian itu yang dipakai untuk Kepatuhan, Kedisiplinan, dan Preparation (isian bulanan hanya dipakai bila tidak ada data harian). Improvement, Training, dan QCC tetap diisi di sini.</p></div>`},
emp(){let h=`<div class="card"><h2>Tambah karyawan</h2><div class="bar"><label>Nama<input id="nn"></label><label>NIK<input id="nk"></label><label>Line bulan ${mname(ym)}<select id="nl">${S.cfg.lines.map(l=>`<option>${l}</option>`).join("")}</select></label><button class="b" onclick="addEmp()">Simpan karyawan</button></div></div><div class="card"><h2>Tempel banyak karyawan dari Excel</h2><label>Satu baris per karyawan, kolom: NIK, Nama, Line (pisah tab, titik koma, atau koma). Line boleh dikosongkan.<textarea id="bulk" rows="5" style="width:100%;font:inherit;padding:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:5px" placeholder="2506440&#9;ADI SAFRI FALAKHI&#9;IMV FRONT"></textarea></label><div class="bar" style="margin-top:8px"><button class="b" onclick="bulkEmp()">Tambahkan semua</button></div><p class="note">Karyawan dan lini awal dicatat untuk bulan ${mname(ym)} (ganti bulan di tab Input bulanan).</p></div><div class="card"><h2>Daftar karyawan</h2><div class="sc"><table><thead><tr><th>Nama</th><th>NIK</th><th>Riwayat line</th><th></th></tr></thead><tbody>`;
 S.emps.forEach(e=>{const ks=Object.keys(S.rec).filter(k=>k.startsWith(e.id+"|")).sort();
  h+=`<tr><td>${e.nama}</td><td>${e.nik||"–"}</td><td>${ks.map(k=>`<span class="tag">${mname(k.slice(-7))}: ${S.rec[k].line}</span>`).join(" ")||'<span class="mut">Belum ada</span>'}</td><td><button class="b g" onclick="delEmp('${e.id}')">Hapus</button></td></tr>`});

matrix(){let h=bar({per:1}),list=months(yr,per),P=`${bulan[per*4]}–${bulan[per*4+3]} ${yr}`;

 h+=`<div class="card"><h2>Input harian – ${new Date(dt+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</h2><div class="sc"><table><thead><tr><th>Karyawan</th><th>Line hari ini</th><th>Absensi</th>${sh.map(c=>`<th class="n">${c[1]}<br>${c[2]}</th><th class="n">${c[1]}<br>${c[3]}</th><th class="n">%</th>`).join("")}</tr></thead><tbody>`;
 S.emps.forEach(e=>{const r=S.day[e.id+"|"+dt]||{},ln=dlineOf(e.id,dt);
  h+=`<tr><td>${e.nama}</td><td><select onchange="setDay('${e.id}','line',this.value)">${S.cfg.lines.concat(S.cfg.lines.includes(ln)?[]:[ln]).map(l=>`<option ${l==ln?"selected":""}>${l}</option>`).join("")}</select></td>`+absSel(e.id)+
  sh.map(c=>["O","X"].map(z=>`<td class="n"><input type="number" min="0" step="any" value="${r[c[0]+z]??""}" onchange="setDay('${e.id}','${c[0]+z}',this.value)"></td>`).join("")+`<td class="n">${pc(ratio(r[c[0]+"O"],r[c[0]+"X"]))}</td>`).join("")+`</tr>`});
 h+=`</tbody></table></div><p class="note">Isi jumlah O/X per tanggal; tersimpan otomatis. Kolom Absensi: Sakit −${pen().s} poin dan Alpa −${pen().a} poin dari total KPI bulan itu untuk setiap hari; Cuti Tahunan dan Cuti Khusus tidak mengurangi. Line mengikuti line terakhir dan bisa diganti kapan saja. Jika line berubah di tengah bulan, nilai bulan itu dicatat di line terakhir.</p></div>`;
 h+=`<div class="card"><h2>Akumulasi ${mname(ym)} (menjadi nilai bulanan)</h2><div class="sc"><table><thead><tr><th>Karyawan</th><th>Line</th><th class="n">Hari terisi</th><th class="n">Sakit</th><th class="n">Alpa</th><th class="n">Cuti</th><th class="n">Potongan (poin)</th>${CS.map(c=>`<th class="n">${c[1]}</th>`).join("")}</tr></thead><tbody>`+S.emps.map(e=>{const c=comp(e.id,ym);return `<tr><td>${e.nama}</td><td>${lineOf(e.id,ym)}</td><td class="n">${dayKeys(e.id,ym).length}</td>${absCells(e.id,ym)}${CS.map(x=>`<td class="n">${pc(c&&c[x[0]])}</td>`).join("")}</tr>`}).join("")+`</tbody></table></div><p class="note">Nilai bulanan = total O ÷ (O + X) seluruh hari dalam bulan, lalu otomatis masuk ke Dashboard KPI dan Matrix skill.</p></div>`;
 sh.forEach(c=>{h+=`<div class="card"><h2>Chart ${c[1]} – ${dt}</h2>${barSvg(S.emps.map(e=>({l:nm(e),v:dayPct(e.id,dt,c[0])})),true)}</div>`});
 return h};
function dl(t,name,mime){(window.claude?claude.use("downloads"):Promise.resolve(null)).then(d=>{if(!d){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:mime||"text/html;charset=utf-8"}));a.download=name;document.body.appendChild(a);a.click();a.remove();return}return d.save({filename:name,data:t})}).catch(e=>{if(e&&e.code!=="declined")alert("Gagal mengunduh: "+(e.message||e.code))})}
function exportViewer(){const st=[...document.querySelectorAll("style")].find(x=>x.textContent.includes("--pri")),sc=[...document.scripts].find(x=>x.textContent.includes('const KEY="kpi-mp-v2"'));
 if(!st||!sc){alert("Gagal membuat file: sumber halaman tidak ditemukan.");return}
 const snap=clone({emps:S.emps.map(e=>({...e,nik:""})),rec:S.rec,day:S.day,abs:S.abs,cfg:S.cfg,at:new Date().toLocaleString("id-ID")});
 const j=JSON.stringify(snap).replace(/</g,"\\u003c"),code=sc.textContent.replace(/<\/script/gi,"<\\/script");
 const html='<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KPI & Skill Matrix MP Quality (lihat saja)</title><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"><\/script>'+st.outerHTML+'</head><body><header><h1>KPI & Skill Matrix Man Power Quality</h1><p class="sub">Tampilan lihat saja – data per '+snap.at+'</p><p class="note" id="st"></p><nav id="nav"></nav></header><main id="app"></main><script>window.__SNAP='+j+';'+code+'<\/script></body></html>';
 dl(html,"KPI_lihat-saja_"+new Date().toISOString().slice(0,10)+".html")}
function exportXlsx(){if(!window.XLSX){alert("Pustaka Excel belum termuat (butuh koneksi internet). Muat ulang halaman lalu coba lagi.");return}
 const X=XLSX,wb=X.utils.book_new(),add=(n,r)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(r),n.slice(0,31)),n1=v=>v==null?"":Math.round(v*10)/10,kh=S.cfg.kpi.map((k,i)=>`${i+1}. ${k.n}`),P=`${bulan[per*4]}-${bulan[per*4+3]} ${yr}`;
 let r=[["NIK","Nama","Bulan","Line"].concat(kh.map(h=>h+" - realisasi (%)"),kh.map(h=>h+" - score"),["Potongan absensi","Total","Grade"])];
 S.emps.forEach(e=>mall(yr).forEach(m=>{const k=kpi(e.id,[m]);if(!k)return;const g=grade(k.total);r.push([e.nik,e.nama,m,lineOf(e.id,m)].concat(k.pts.map(p=>p.real==null?"":n1(p.real*100)),k.pts.map(p=>n1(p.score)),[n1(k.ded),n1(k.total),g?g[0]:""]))}));
 add("KPI Bulanan "+yr,r);
 r=[["NIK","Nama","Jan-Apr","Mei-Agu","Sep-Des","Tahunan","Grade tahunan"]];
 S.emps.forEach(e=>{const t=[0,1,2].map(q=>kpi(e.id,months(yr,q))?.total),y=kpi(e.id,mall(yr))?.total,g=grade(y);r.push([e.nik,e.nama].concat(t.map(n1),[n1(y),g?g[0]:""]))});
 add("Rekap 4 Bulan & Tahunan "+yr,r);
 const list=months(yr,per);
 r=[["NIK","Nama","Instruksi kerja","Standar inspeksi","Visual/appearance","Analisa masalah","Laporan inspeksi","Alat ukur","Sampel AQL","Rata-rata"]];
 S.emps.forEach(e=>{const c=agg(e.id,list);if(!c)return;const v=[c.kep,c.kep,c.kep,avg([c.imp,c.qcc]),c.pre,c.pre,c.dis].map(q);r.push([e.nik,e.nama].concat(v,[n1(avg(v))]))});
 add("General Matrix "+P,r);
 r=[["NIK","Nama","Line","Bulan di line","Visual/appearance","Dimensi & fungsi","Defect part","Analisa & identifikasi"]];
 S.emps.forEach(e=>[...new Set(list.map(m=>comp(e.id,m)?.line).filter(Boolean))].forEach(l=>{const c=agg(e.id,list,l);r.push([e.nik,e.nama,l,c.n].concat([c.kep,c.pre,c.dis,avg([c.imp,c.qcc])].map(q)))}));
 add("Multi Skill "+P,r);
 const val=x=>x==null?"":x,nm=k=>S.emps.find(z=>z.id===k.split("|")[0]);
 r=[HDR];Object.keys(S.rec).sort((a,b)=>a.slice(-7)<b.slice(-7)?-1:1).forEach(k=>{const e=nm(k);if(e)r.push([e.nik,e.nama,k.slice(-7),S.rec[k].line].concat(FL.map(f=>val(S.rec[k][f]))))});add("Data Input Bulanan",r);
 if(Object.keys(S.day).length){r=[HDRD];Object.keys(S.day).sort((a,b)=>a.slice(-10)<b.slice(-10)?-1:1).forEach(k=>{const e=nm(k);if(e)r.push([e.nik,e.nama,k.slice(-10),S.day[k].line].concat(FL.slice(0,6).map(f=>val(S.day[k][f]))))});add("Data Harian",r)}
 if(Object.keys(S.abs).length){r=[["NIK","Nama","Tanggal","Status"]];Object.keys(S.abs).sort((a,b)=>a.slice(-10)<b.slice(-10)?-1:1).forEach(k=>{const e=nm(k);if(e)r.push([e.nik,e.nama,k.slice(-10),ABSN[S.abs[k]]||""])});add("Absensi",r)}
 try{const buf=X.write(wb,{bookType:"xlsx",type:"array"});dl(buf,`Laporan_KPI_${yr}.xlsx`,"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet")}catch(e){alert("Gagal membuat file Excel: "+e.message)}}
const pen=()=>S.cfg.pen||{s:5,a:10},pn=(k,v)=>{S.cfg.pen=Object.assign({},pen(),{[k]:+v||0});save();draw()};
const ABS=[["","Hadir / belum diisi"],["S","Sakit"],["A","Alpa"],["CT","Cuti Tahunan"],["CK","Cuti Khusus"]],ABSN={S:"Sakit",A:"Alpa",CT:"Cuti Tahunan",CK:"Cuti Khusus"};
const absSum=(id,list)=>{const o={S:0,A:0,CT:0,CK:0};list.forEach(m=>Object.keys(S.abs).forEach(k=>{if(k.startsWith(id+"|"+m)&&o[S.abs[k]]!=null)o[S.abs[k]]++}));return o};
const absDed=(id,m)=>{const o=absSum(id,[m]);return o.S*pen().s+o.A*pen().a};
const absCells=(id,m)=>{const o=absSum(id,[m]),d=absDed(id,m);return `<td class="n">${o.S}</td><td class="n">${o.A}</td><td class="n">${o.CT+o.CK}</td><td class="n">${d?"-"+d:"0"}</td>`};
const absSel=id=>{const v=S.abs[id+"|"+dt]||"";return `<td><select onchange="setAbs('${id}',this.value)">${ABS.map(a=>`<option value="${a[0]}" ${a[0]==v?"selected":""}>${a[1]}</option>`).join("")}</select></td>`};
function setAbs(id,v){const k=id+"|"+dt;if(v)S.abs[k]=v;else delete S.abs[k];dirty.add(dt.slice(0,7));save();draw()}
function setF(id,f,v){const k=id+"|"+ym,r=S.rec[k]||(S.rec[k]={line:lineOf(id,ym)});if(f==="line")r.line=v;else r[f]=v===""?null:+v;save();draw()}
function addEmp(){const n=$("#nn").value.trim();if(!n)return;const id="e"+Date.now();S.emps.push({id,nama:n,nik:$("#nk").value.trim()});S.rec[id+"|"+ym]={line:$("#nl").value};sel=sel||id;save();draw()}
function delEmp(id){if(!confirm("Hapus karyawan beserta seluruh datanya?"))return;S.emps=S.emps.filter(e=>e.id!==id);Object.keys(S.rec).forEach(k=>{if(k.startsWith(id+"|"))delete S.rec[k]});Object.keys(S.day).forEach(k=>{if(k.startsWith(id+"|")){dirty.add(k.slice(-10,-3));delete S.day[k]}});Object.keys(S.abs).forEach(k=>{if(k.startsWith(id+"|")){dirty.add(k.slice(-10,-3));delete S.abs[k]}});if(sel===id)sel=S.emps[0]?.id;save();draw()}
const tabs=[["dash","Dashboard KPI"],["dayin","Input harian"],["input","Input bulanan"],["emp","Karyawan"],["matrix","Matrix skill"],["set","Pengaturan"]];
function draw(){if(RO&&tab!="dash"&&tab!="matrix")tab="dash";$("#nav").innerHTML=(RO?tabs.filter(t=>t[0]=="dash"||t[0]=="matrix"):tabs).map(t=>`<button class="${t[0]===tab?"on":""}" onclick="tab='${t[0]}';draw()">${t[1]}</button>`).join("");$("#app").innerHTML=views[tab]()}
draw();initDb();
</script>
